<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f1ea" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caja</title>
<script>
/* Apply the saved theme before the page paints (avoids a flash) */
(function(){try{var th=(JSON.parse(localStorage.getItem("cafeSettings.v2")||"{}").theme)||"light";
if(th==="auto")th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=th;}catch(e){document.documentElement.dataset.theme="light";}})();
</script>
<style>
/* =====================================================================
   Cafe cash register — single file, no server.
   Menu & settings are edited in the app (gear icon) and saved ONLY in
   this browser's local storage on the device. Nothing is sent online.
   ===================================================================== */
:root{
  --bg:#f6f1ea; --panel:#ffffff; --raised:#ffffff; --field:#ffffff; --ink:#1f1a17; --ink-inv:#ffffff;
  --muted:#7a6f66; --line:#e8dfd4; --chip:#efe6da; --chip-ink:#3b322c;
  --accent:#b5562b; --accent-ink:#fff; --accent-soft:#f6e3d8;
  --ok:#2f7d4f; --ok-soft:#e3f1e8; --warn:#c0392b; --warn-soft:#f8e3df;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 2px 8px rgba(60,40,20,.05);
  --r:16px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14110e; --panel:#1d1915; --raised:#26201b; --field:#2a241e; --ink:#f3ece4; --ink-inv:#14110e;
  --muted:#a3978b; --line:#352d26; --chip:#2c2520; --chip-ink:#e6dcd1;
  --accent:#e07a48; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --ok:#52b77f; --ok-soft:#1b2e22; --warn:#ec6b5e; --warn-soft:#3a1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
body{transition:background .2s,color .2s}
input,select{font:inherit;color:inherit;user-select:text}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
svg{display:block}
.app{display:grid;grid-template-columns:1fr 370px;height:100vh;height:100dvh}
.screen{display:none}.screen.on{display:contents}

/* ---------- Header ---------- */
.menu{display:flex;flex-direction:column;min-width:0;padding:16px 18px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.head h1{font-size:22px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-r{display:flex;align-items:center;gap:8px}
.clock{color:var(--muted);font-size:14px;margin-right:6px;font-variant-numeric:tabular-nums}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);transition:background .15s,color .15s}
.ibtn svg{width:21px;height:21px}
.ibtn:active{background:var(--chip);color:var(--ink)}
.ibtn[hidden]{display:none}

/* ---------- Categories & items ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:11px 20px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-weight:600;font-size:16px;transition:background .15s}
.cat.on{background:var(--ink);color:var(--ink-inv)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;align-content:start;padding:2px 2px 18px}
.item{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px 14px;
  min-height:112px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  position:relative;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.item:active{transform:scale(.97)}
.item.in{border-color:var(--accent)}
.item b{font-size:18px;line-height:1.25;font-weight:650;padding-right:26px}
.item span{align-self:flex-start;color:var(--accent);background:var(--accent-soft);font-weight:700;font-size:16px;
  padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.item .q{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-style:normal;
  font-weight:800;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;padding:0 8px}
.hint{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 20px;font-size:17px;line-height:1.6}

/* ---------- Order panel ---------- */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.side-h h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.badge{background:var(--chip);color:var(--chip-ink);font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px}
.clear{color:var(--warn);font-size:15px;font-weight:600;padding:8px 10px;border-radius:8px}
.clear:disabled{opacity:.3}
.lines{flex:1;overflow-y:auto;padding:4px 0}
.empty{color:var(--muted);text-align:center;padding:60px 24px;font-size:16px;line-height:1.5}
.empty svg{width:44px;height:44px;margin:0 auto 12px;opacity:.45}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.line .n{font-weight:600;font-size:16px}
.line .p{font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.line .nt{grid-column:1/-1;font-size:14px;color:var(--accent);font-weight:600;margin-top:-2px}
.qty{display:flex;align-items:center;gap:6px;grid-column:1/-1}
.qty button{width:42px;height:38px;border-radius:10px;background:var(--chip);color:var(--chip-ink);font-size:20px;font-weight:700}
.qty button:active{filter:brightness(.9)}
.qty .notebtn{width:auto;padding:0 12px;font-size:14px;margin-left:auto}
.qty em{font-style:normal;min-width:30px;text-align:center;font-weight:700;font-size:17px}
.qty small{color:var(--muted);font-size:13px;margin-left:6px}
.foot{padding:16px 18px 18px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.tot span{color:var(--muted);font-size:16px}
.tot b{font-size:32px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big{width:100%;padding:19px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);
  font-size:20px;font-weight:700;transition:opacity .15s,transform .08s}
.big:active{transform:scale(.99)}
.big:disabled{opacity:.3}
.big.ok{background:var(--ok);color:#fff}

/* ---------- Payment ---------- */
.pay{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 18px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.paytop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.back{background:var(--chip);color:var(--chip-ink);padding:11px 16px;border-radius:10px;font-weight:600}
.discbtn{padding:11px 16px;border-radius:10px;font-weight:700;border:2px dashed var(--line);color:var(--accent)}
.discbtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line)}
.row span{color:var(--muted);font-size:17px}
.row b{font-size:28px;font-variant-numeric:tabular-nums}
.row.sm b{font-size:20px;font-weight:600}
.row.disc b{color:var(--accent)}
.row[hidden]{display:none}
.change{margin-top:14px;border-radius:14px;padding:18px;background:var(--ok-soft);display:flex;justify-content:space-between;align-items:center}
.change span{font-size:18px;font-weight:600;color:var(--ok)}
.change b{font-size:52px;color:var(--ok);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.change.short{background:var(--warn-soft)}
.change.short span,.change.short b{color:var(--warn)}
.change.short b{font-size:34px}
.summary{flex:1;overflow-y:auto;margin-top:14px;font-size:15px;color:var(--muted)}
.summary div{display:flex;justify-content:space-between;padding:5px 2px}
.summary i{display:block;font-style:normal;color:var(--accent);font-size:13px;padding:0 2px 4px 18px}
.display{font-size:46px;font-weight:700;text-align:right;padding:10px 14px;background:var(--bg);
  border-radius:12px;margin-bottom:12px;min-height:74px;font-variant-numeric:tabular-nums}
.display small{font-size:24px;color:var(--muted);margin-right:4px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.quick button{padding:15px 6px;border-radius:11px;background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:18px}
.quick .exact{background:var(--ink);color:var(--ink-inv)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;margin-bottom:12px}
.pad button{border-radius:11px;background:var(--bg);font-size:27px;font-weight:600;min-height:52px}
.pad button:active,.quick button:active{filter:brightness(.9)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:8;background:rgba(20,14,8,.45);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px}
.sheet h3{margin:0 0 4px;font-size:21px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.sheet input[type=text]{width:100%;border:1px solid var(--line);border-radius:11px;padding:14px;font-size:18px;background:var(--field)}
.sheet input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chips button{padding:10px 14px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-weight:600;font-size:15px}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.preview{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);display:flex;justify-content:space-between;font-size:16px}
.preview b{font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;margin-top:20px}
.actions button{flex:1;padding:15px;border-radius:12px;font-weight:700;font-size:16px;background:var(--chip);color:var(--chip-ink)}
.actions .primary{background:var(--accent);color:var(--accent-ink)}
.actions .danger{background:var(--warn-soft);color:var(--warn);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.stat{background:var(--bg);border-radius:14px;padding:14px 16px}
.stat span{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.stat b{font-size:26px;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1;background:var(--ok-soft)}
.stat.wide b{color:var(--ok);font-size:34px}

/* ---------- Settings overlay ---------- */
.settings{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column}
.settings.on{display:flex}
.s-top{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.s-top h2{margin:0;font-size:20px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-left:8px}
.tab{padding:9px 18px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.saved{margin-left:auto;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved.flash{color:var(--ok)}
.done{background:var(--ink);color:var(--ink-inv);padding:11px 22px;border-radius:10px;font-weight:700;font-size:16px}
.s-body{flex:1;min-height:0;overflow:hidden}
.pane{display:none;height:100%}.pane.on{display:grid}

#paneMenu{grid-template-columns:280px 1fr;gap:16px;padding:16px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.col-h{padding:14px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}
.catlist{flex:1;overflow-y:auto;padding:8px}
.sc{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:10px;
  text-align:left;font-weight:600;font-size:16px}
.sc small{color:var(--muted);font-weight:600;font-size:13px;background:var(--chip);padding:2px 8px;border-radius:999px}
.sc.on{background:var(--ink);color:var(--ink-inv)}.sc.on small{background:transparent;color:inherit;opacity:.7}
.add{margin:8px;padding:13px;border-radius:10px;border:2px dashed var(--line);color:var(--accent);font-weight:700;font-size:16px}
.add:active{background:var(--chip)}
.ce-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ce-h input{flex:1;min-width:0;font-size:20px;font-weight:700;border:1px solid transparent;border-radius:9px;padding:8px 10px;background:var(--bg)}
.ce-h input:focus{outline:none;border-color:var(--accent);background:var(--field)}
.ib{width:42px;height:42px;border-radius:10px;background:var(--chip);color:var(--chip-ink);font-size:18px;font-weight:700;display:grid;place-items:center;flex:none}
.ib:disabled{opacity:.3}
.ib.del{background:var(--warn-soft);color:var(--warn)}
.items{flex:1;overflow-y:auto;padding:8px 14px}
.ir-head,.ir{display:grid;grid-template-columns:1fr 130px 42px 42px 42px;gap:8px;align-items:center}
.ir-head{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:6px 2px}
.ir{padding:6px 0;border-bottom:1px solid var(--line)}
.ir input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:17px;background:var(--field)}
.ir input:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.price{position:relative}
.price span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.price input{padding-left:24px;text-align:right}
.noitems,.nocat{color:var(--muted);text-align:center;padding:40px 20px;font-size:16px;line-height:1.5}

#paneGeneral{overflow-y:auto;padding:16px;align-content:start;justify-items:center}
.form{width:100%;max-width:680px;display:flex;flex-direction:column;gap:16px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px}
.group h3{margin:14px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>label:first-child,.field>.lbl{font-weight:600;font-size:16px}
.field small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.field input[type=text],.field select{width:260px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px;background:var(--field)}
.field input.short{width:90px;text-align:center}
.seg{display:flex;background:var(--chip);padding:3px;border-radius:10px;flex:none}
.seg button{padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:15px;transition:.2s}
.sw i:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:before{transform:translateX(22px)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:10px;background:var(--chip);color:var(--chip-ink);font-weight:600;font-size:15px}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.note{color:var(--muted);font-size:13px;line-height:1.55;padding:4px 4px 24px;text-align:center}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(140px);
  background:var(--ink);color:var(--ink-inv);padding:15px 24px;border-radius:14px;font-weight:600;font-size:18px;
  transition:transform .25s;z-index:9;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--warn);color:#fff}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{border-left:0;border-top:1px solid var(--line);max-height:45vh}
  .pay{grid-template-columns:1fr;overflow-y:auto}
  .clock{display:none}
  #paneMenu{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .catlist{max-height:200px}
  .ir-head,.ir{grid-template-columns:1fr 100px 38px 38px 38px}
  .saved span{display:none}
  .field{flex-wrap:wrap}.field input[type=text],.field select{width:100%}
}
@media print{ body *{visibility:hidden} #printArea,#printArea *{visibility:visible} #printArea{position:absolute;top:0;left:0} }
</style>
</head>
<body>
<div class="app">

  <!-- MENU SCREEN -->
  <div class="screen on" id="scrMenu">
    <section class="menu">
      <div class="head">
        <div class="brand">
          <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg></div>
          <h1 id="shopName"></h1>
        </div>
        <div class="head-r">
          <span class="clock" id="clock"></span>
          <button class="ibtn" id="btnReprint" aria-label="Reprint" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          </button>
          <button class="ibtn" id="btnToday" aria-label="Today">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          </button>
          <button class="ibtn" id="btnTheme" aria-label="Light / dark">
            <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

const t = (k, v={}) => (STR[CONFIG.lang]?.[k] ?? STR.en[k] ?? k).replace(/\{(\w)\}/g, (_,m) => v[m] ?? "");

/* ---------- Device-only settings storage ---------- */
const STORE_KEY = "cafeSettings.v2";
try { localStorage.removeItem("cafeSettings.v1"); } catch(_) {}   // clear old test data from earlier versions
const clone = o => JSON.parse(JSON.stringify(o));
function normalize(s){
  const d = clone(DEFAULTS), out = Object.assign(d, s || {});
  out.decimals = +out.decimals === 0 ? 0 : 2;
  out.theme = ["auto","light","dark"].includes(out.theme) ? out.theme : "light";
  out.lang = out.lang === "en" ? "en" : "es";
  out.cashButtons = (Array.isArray(out.cashButtons) ? out.cashButtons : d.cashButtons).map(Number).filter(n => n > 0);
  out.quickNotes = (Array.isArray(out.quickNotes) ? out.quickNotes : d.quickNotes).map(String).filter(x => x.trim());
  out.menu = (Array.isArray(out.menu) ? out.menu : []).map(c => ({
    category: String(c?.category ?? "Category"),
    items: (Array.isArray(c?.items) ? c.items : []).map(i => ({ name: String(i?.name ?? ""), price: +i?.price || 0 })),
  }));
  return out;
}
function loadSettings(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return normalize(JSON.parse(raw)); } catch(_) {}
  return normalize(null);
}
function savedIdle(){ const n=$("savedNote"); n.classList.remove("flash"); n.innerHTML = `🔒 <span>${t("savedOnly")}</span>`; }
function saveSettings(){
  let ok = true;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(CONFIG)); } catch(_) { ok = false; }
  const n = $("savedNote");
  if (!ok){ n.classList.remove("flash"); n.innerHTML = `⚠️ <span>${t("cantSave")}</span>`; return; }
  n.classList.add("flash"); n.innerHTML = `✓ <span>${t("saved")}</span>`;
  clearTimeout(saveSettings.t); saveSettings.t = setTimeout(savedIdle, 1400);
}
let CONFIG = loadSettings();

const $ = id => document.getElementById(id);
let scale = 100;
const toCents = v => Math.round(v * scale);           // all money math in integer cents
const money = c => CONFIG.currencySymbol + (c / scale).toLocaleString("en-US",
  {minimumFractionDigits: CONFIG.decimals, maximumFractionDigits: CONFIG.decimals});
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const buzz = () => { if (CONFIG.vibrate) try { navigator.vibrate?.(12); } catch(_) {} };
const locale = () => CONFIG.lang === "es" ? "es" : "en-US";

/* ---------- Language ---------- */
function applyLang(){
  document.documentElement.lang = CONFIG.lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el => el.innerHTML = t(el.dataset.th));
  savedIdle();
}

/* ---------- Theme ---------- */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const resolvedTheme = () => CONFIG.theme === "auto" ? (darkMQ.matches ? "dark" : "light") : CONFIG.theme;
function applyTheme(){
  const th = resolvedTheme();
  document.documentElement.dataset.theme = th;
  $("metaTheme").content = th === "dark" ? "#14110e" : "#f6f1ea";
  $("icoSun").style.display = th === "dark" ? "block" : "none";
  $("icoMoon").style.display = th === "dark" ? "none" : "block";
}
darkMQ.addEventListener?.("change", () => { if (CONFIG.theme === "auto") applyTheme(); });
$("btnTheme").onclick = () => { CONFIG.theme = resolvedTheme() === "dark" ? "light" : "dark"; saveSettings(); applyTheme(); };

/* ---------- Keep screen awake ---------- */
let wakeLock = null;
async function updateWakeLock(){
  try {
    if (CONFIG.keepAwake && document.visibilityState === "visible" && "wakeLock" in navigator){
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    } else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(_) { wakeLock = null; }
}
document.addEventListener("visibilitychange", updateWakeLock);

/* ---------- Modal ---------- */
function openModal(html){ $("sheet").innerHTML = html; $("modal").classList.add("on"); }
function closeModal(){ $("modal").classList.remove("on"); $("sheet").innerHTML = ""; }
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

/* ---------- State (in memory only) ---------- */
let order = [];            // [{name, price(cents), qty, note}]
let discount = null;       // {type:"pct"|"amt", value}
let activeCat = 0;
let entry = "";            // typed cash amount, as a string

const subtotal = () => order.reduce((a,l)=>a+l.price*l.qty,0);
function discountCents(){
  if (!discount) return 0;
  const s = subtotal();
  const d = discount.type === "pct" ? Math.round(s * discount.value / 100) : toCents(discount.value);
  return Math.max(0, Math.min(s, d));
}
const grandTotal = () => subtotal() - discountCents();
const discountLabel = () => discount ? (discount.type === "pct" ? `${discount.value}%` : money(toCents(discount.value))) : "";

/* ---------- Menu ---------- */
function renderCats(){
  activeCat = Math.max(0, Math.min(activeCat, CONFIG.menu.length - 1));
  $("cats").innerHTML = CONFIG.menu.map((c,i) =>
    `<button class="cat ${i===activeCat?"on":""}" data-i="${i}">${esc(c.category)}</button>`).join("");
}
function renderGrid(){
  const cat = CONFIG.menu[activeCat];
  const items = cat ? cat.items.map((it,i) => ({it,i})).filter(x => x.it.name.trim()) : [];
  if (!items.length){
    $("grid").innerHTML = `<div class="hint">${cat ? t("noItemsCat") : t("emptyMenu")}<br>${t("tapGear")}</div>`;
    return;
  }
  $("grid").innerHTML = items.map(({it,i}) => {
    const q = order.filter(l => l.name === it.name).reduce((a,l)=>a+l.qty,0);
    return `<button class="item ${q?"in":""}" data-i="${i}">
      ${q ? `<i class="q">${q}</i>` : ""}
      <b>${esc(it.name)}</b><span>${money(toCents(it.price))}</span></button>`;
  }).join("");
}
const EMPTY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>`;
function renderOrder(){
  const lines = $("lines");
  if (!order.length){ lines.innerHTML = `<div class="empty">${EMPTY_ICON}${t("emptyOrder")}</div>`; }
  else lines.innerHTML = order.map((l,i) => `
    <div class="line">
      <span class="n">${esc(l.name)}</span><span class="p">${money(l.price*l.qty)}</span>
      ${l.note ? `<span class="nt">› ${esc(l.note)}</span>` : ""}
      <div class="qty">
        <button data-act="dec" data-i="${i}" aria-label="−">−</button><em>${l.qty}</em>
        <button data-act="inc" data-i="${i}" aria-label="+">+</button>
        <small>${money(l.price)} ${t("each")}</small>
        <button class="notebtn" data-act="note" data-i="${i}">${l.note ? t("editNote") : t("addNote")}</button>
      </div>
    </div>`).join("");

  $("btnClear").disabled = !order.length;

function resetOrder(){ order = []; discount = null; entry = ""; }

$("cats").onclick = e => { const b=e.target.closest(".cat"); if(!b) return; activeCat=+b.dataset.i; renderCats(); renderGrid(); };
$("grid").onclick = e => {
  const b = e.target.closest(".item"); if(!b) return;
  const it = CONFIG.menu[activeCat].items[+b.dataset.i];
  let idx = order.findIndex(l => l.name === it.name && !l.note);
  if (idx >= 0) order[idx].qty++; else { order.push({name: it.name, price: toCents(it.price), qty: 1, note: ""}); idx = order.length-1; }
  buzz(); renderOrder();
  $("lines").querySelectorAll(".line")[idx]?.scrollIntoView({block:"nearest"});
};
$("lines").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  const i = +b.dataset.i, l = order[i];
  if (b.dataset.act === "inc") l.qty++;
  else if (b.dataset.act === "dec"){ if (--l.qty <= 0) order.splice(i, 1); }
  else if (b.dataset.act === "note"){ openNote(i); return; }
  renderOrder();
};
$("btnClear").onclick = () => { if (order.length && confirm(t("clearConfirm"))) { resetOrder(); renderOrder(); } };
$("btnPay").onclick = () => { entry=""; showScreen("scrPay"); renderPay(); };
$("btnBack").onclick = () => showScreen("scrMenu");

/* ---------- Item notes ---------- */
function openNote(i){
  const l = order[i];
  openModal(`
    <h3>${t("noteTitle",{x:esc(l.name)})}</h3>
    <div class="sub">${l.qty} × ${esc(l.name)}</div>
    <input type="text" id="noteIn" value="${esc(l.note)}" placeholder="${esc(t("notePh"))}" maxlength="80">
    <div class="chips" id="noteChips">${CONFIG.quickNotes.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="actions">
      ${l.note ? `<button class="danger" id="noteDel">${t("remove")}</button>` : ""}
      <button id="noteCancel">${t("cancel")}</button>
      <button class="primary" id="noteSave">${t("save")}</button>
    </div>`);
  const inp = $("noteIn");
  const parts = () => inp.value.split(",").map(s=>s.trim()).filter(Boolean);
  const syncChips = () => { const p = parts(); $("noteChips").querySelectorAll("button").forEach(b => b.classList.toggle("on", p.includes(b.dataset.q))); };
  syncChips(); inp.oninput = syncChips;
  $("noteChips").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    let p = parts(); p = p.includes(b.dataset.q) ? p.filter(x=>x!==b.dataset.q) : [...p, b.dataset.q];
    inp.value = p.join(", "); syncChips();
  };
  const save = note => {
    l.note = note.trim();
    const dup = order.findIndex((o,j) => j!==i && o.name===l.name && o.note===l.note);   // merge identical lines
    if (dup >= 0){ order[dup].qty += l.qty; order.splice(i,1); }
    closeModal(); renderOrder();
  };
  $("noteSave").onclick = () => save(parts().join(", "));
  $("noteCancel").onclick = closeModal;
  if ($("noteDel")) $("noteDel").onclick = () => save("");
  inp.onkeydown = e => { if (e.key === "Enter") $("noteSave").click(); };
  setTimeout(() => inp.focus(), 50);
}

/* ---------- Discount ---------- */
function openDiscount(){
  let type = discount?.type || "pct", val = discount ? String(discount.value) : "";
  const draw = () => {
    const s = subtotal();
    const v = parseFloat(val) || 0;
    const d = Math.max(0, Math.min(s, type === "pct" ? Math.round(s * Math.min(v,100) / 100) : toCents(v)));
    openModal(`
      <h3>${t("discTitle")}</h3>
      <div class="sub">${t("discSub")} · ${t("subtotal")} ${money(s)}</div>
      <div class="seg" id="discType" style="margin-bottom:12px;display:inline-flex">
        <button data-v="pct" class="${type==="pct"?"on":""}">${t("pct")} %</button>
        <button data-v="amt" class="${type==="amt"?"on":""}">${t("amt")} ${esc(CONFIG.currencySymbol)}</button>
      </div>
      <input type="text" id="discIn" inputmode="decimal" value="${esc(val)}" placeholder="${esc(t("discPh"))}">
      ${type==="pct" ? `<div class="chips" id="discChips">${[5,10,15,20,25,50].map(p=>`<button data-p="${p}" class="${v===p?"on":""}">${p}%</button>`).join("")}</div>` : ""}
      <div class="preview"><span>${t("discount")} −${money(d)}</span><span>${t("newTotal")} <b>${money(s-d)}</b></span></div>
      <div class="actions">
        ${discount ? `<button class="danger" id="discDel">${t("removeDisc")}</button>` : ""}
        <button id="discCancel">${t("cancel")}</button>
        <button class="primary" id="discApply" ${v>0?"":"disabled style=opacity:.4"}>${t("apply")}</button>
      </div>`);
    const inp = $("discIn");
    inp.oninput = () => { val = inp.value.replace(/[^0-9.]/g,""); const pos = inp.selectionStart; draw(); const n=$("discIn"); n.focus(); n.setSelectionRange(pos,pos); };
    $("discType").onclick = e => { const b=e.target.closest("button"); if(!b) return; type=b.dataset.v; val=""; draw(); $("discIn").focus(); };
    if ($("discChips")) $("discChips").onclick = e => { const b=e.target.closest("button"); if(!b) return; val=b.dataset.p; draw(); };
    $("discCancel").onclick = closeModal;
    if ($("discDel")) $("discDel").onclick = () => { discount = null; closeModal(); renderPay(); };
    $("discApply").onclick = () => {
      if (!(v > 0)) return;
      discount = {type, value: type === "pct" ? Math.min(v,100) : v};
      closeModal(); renderPay();
    };
  };
  draw();
}
$("btnDisc").onclick = openDiscount;

/* ---------- Payment ---------- */
const received = () => entry ? Math.round(parseFloat(entry) * scale) || 0 : 0;

function buildPad(){
  const keys = ["1","2","3","4","5","6","7","8","9", CONFIG.decimals ? "." : "00","0","⌫"];
  $("pad").innerHTML = keys.map(k=>`<button data-k="${k}">${k}</button>`).join("");
  $("quick").innerHTML = `<button class="exact" data-q="exact">${t("exact")}</button>` +
    CONFIG.cashButtons.map(v=>`<button data-q="${v}">+${esc(CONFIG.currencySymbol)}${v}</button>`).join("");
}
$("pad").onclick = e => {
  const k = e.target.closest("button")?.dataset.k; if(!k) return;
  if (k === "⌫") entry = entry.slice(0,-1);
  else if (k === ".") { if (!entry.includes(".")) entry = (entry||"0") + "."; }
  else {
    const dot = entry.indexOf(".");
    if (dot >= 0 && entry.length - dot > CONFIG.decimals) return;
    if (entry.replace(".","").length >= 9) return;
    entry = (entry === "0" ? "" : entry) + k;
  }
  renderPay();
};
$("quick").onclick = e => {
  const q = e.target.closest("button")?.dataset.q; if(!q) return;
  const cents = q === "exact" ? grandTotal() : received() + toCents(+q);
  entry = (cents/scale).toFixed(CONFIG.decimals);
  renderPay();
};
function renderPay(){
  const s = subtotal(), d = discountCents(), tot = s - d, r = received(), diff = r - tot;
  $("rowSub").hidden = $("rowDisc").hidden = !d;
  $("paySub").textContent = money(s);
  $("discLbl").textContent = `${t("discount")} (${discountLabel()})`;
  $("payDisc").textContent = "−" + money(d);
  $("btnDisc").textContent = discount ? `${t("discount")}: ${discountLabel()}` : t("addDiscount");
  $("btnDisc").classList.toggle("on", !!discount);
  $("payTotal").textContent = money(tot);
  $("payRecv").textContent = money(r);
  $("display").innerHTML = `<small>${esc(CONFIG.currencySymbol)}</small>${esc(entry || "0")}`;
  const row = $("changeRow");
  if (diff >= 0){ row.classList.remove("short"); $("changeLbl").textContent=t("change"); $("payChange").textContent=money(diff); }
  else { row.classList.add("short"); $("changeLbl").textContent=t("owed"); $("payChange").textContent=money(-diff); }
  $("btnConfirm").disabled = !(r >= tot && s > 0);
  $("paySummary").innerHTML = order.map(l=>`<div><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.price*l.qty)}</span></div>${l.note?`<i>› ${esc(l.note)}</i>`:""}`).join("");
}

/* ---------- Bill number + today's totals (this tablet only, reset daily) ---------- */
const todayKey = () => new Date().toDateString();
function nextBillNumber(){
  let n = 1;
  try {
    const s = JSON.parse(localStorage.getItem("billCounter") || "{}");
    n = s.day === todayKey() ? s.n + 1 : 1;
    localStorage.setItem("billCounter", JSON.stringify({day: todayKey(), n}));
  } catch(_) {}
  return String(n).padStart(4, "0");
}
function getToday(){
  try { const s = JSON.parse(localStorage.getItem("dayTotals") || "{}"); if (s.day === todayKey()) return s; } catch(_) {}
  return {day: todayKey(), orders: 0, cash: 0, disc: 0};
}
function addToToday(totalC, discC){
  const s = getToday(); s.orders++; s.cash += totalC / scale; s.disc += discC / scale;
  try { localStorage.setItem("dayTotals", JSON.stringify(s)); } catch(_) {}
}
$("btnToday").onclick = () => {
  const s = getToday(), c = toCents(s.cash);
  openModal(`
    <h3>${t("todayTitle")} · ${esc(new Date().toLocaleDateString(locale(),{weekday:"long",day:"numeric",month:"long"}))}</h3>
    <div class="sub">${t("todaySub")}</div>
    <div class="stats">
      <div class="stat wide"><span>${t("cashTotal")}</span><b>${money(c)}</b></div>
      <div class="stat"><span>${t("orders")}</span><b>${s.orders}</b></div>
      <div class="stat"><span>${t("avg")}</span><b>${money(s.orders ? Math.round(c / s.orders) : 0)}</b></div>
      <div class="stat" style="grid-column:1/-1"><span>${t("discGiven")}</span><b>${money(toCents(s.disc))}</b></div>
    </div>
    <div class="actions">
      <button class="danger" id="todayReset">${t("resetToday")}</button>
      <button class="primary" id="todayClose">${t("close")}</button>
    </div>`);
  $("todayClose").onclick = closeModal;
  $("todayReset").onclick = () => {
    if (!confirm(t("resetTodayConfirm"))) return;
    try { localStorage.removeItem("dayTotals"); } catch(_) {}
    closeModal();
  };
};

function stamp(d = new Date()){
  return d.toLocaleString(locale(),{weekday:"short",month:"short",day:"numeric"}) + ", " +
         d.toLocaleTimeString(locale(),{hour:"numeric",minute:"2-digit"});
}

/* ---------- Receipt ---------- */
function receiptHTML(bill, subC, discC, totC, recvC){
  const W = CONFIG.paperWidthDots;
  const rows = order.map(l=>`<tr><td>${esc(l.name)}</td><td class="c">${l.qty}</td><td class="r">${money(l.price*l.qty)}</td></tr>` +
    (l.note ? `<tr><td colspan="3" class="nt">&nbsp;&nbsp;› ${esc(l.note)}</td></tr>` : "")).join("");
  const n = order.reduce((a,l)=>a+l.qty,0);
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="format-detection" content="telephone=no">
<style>
body{margin:0;width:${W}px;font-family:"Courier New",monospace;font-size:28px;color:#000;background:#fff}
.w{padding:8px 4px 24px}
h1{font-size:40px;text-align:center;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:inherit}
th{text-align:left;border-top:2px dashed #000;border-bottom:2px dashed #000;padding:6px 0}
td{padding:6px 0;vertical-align:top}
td.nt{padding:0 0 6px;font-size:24px;font-style:italic}
.c{text-align:center;width:80px}.r{text-align:right;width:170px}
.hr{border-top:2px dashed #000;margin:8px 0}
.b{font-weight:bold;font-size:34px}
.f{text-align:center;margin-top:18px}
.rp{text-align:center;font-weight:bold;margin-bottom:8px}
</style></head><body><div class="w">
<!--REPRINT-->
<h1>${esc(CONFIG.shopName)}</h1>
<div>${t("rBill")}: #${bill}</div>
<div>${t("rTime")}: ${esc(stamp())}</div>
<table><tr><th>${t("rItem")}</th><th class="c">${t("rQty")}</th><th class="r">${t("rPrice")}</th></tr>${rows}</table>
<div class="hr"></div>
<div>${t("rItems")}: ${n}</div>
${discC ? `<div>${t("subtotal")}: ${money(subC)}</div><div>${t("discount")} (${esc(discountLabel())}): -${money(discC)}</div>` : ""}
<div class="b">${t("total")}: ${money(totC)}</div>
<div>${t("rCash")}: ${money(recvC)}</div>
<div class="b">${t("change")}: ${money(recvC-totC)}</div>
${CONFIG.receiptFooter ? `<div class="f">${esc(CONFIG.receiptFooter)}</div>` : ""}
</div></body></html>`;
}

function sendToPrinter(html, changeMsg){
  if (CONFIG.printMode === "passprnt"){
    try { sessionStorage.setItem("lastChange", changeMsg); } catch(_) {}
    const back = location.origin + location.pathname;
    location.href = "starpassprnt://v1/print/nopreview?back=" + encodeURIComponent(back) +
      "&size=" + CONFIG.paperWidthDots + "&cut=partial" +
      (CONFIG.openDrawer ? "&drawer=ahead" : "") +
      "&html=" + encodeURIComponent(html);
  } else if (CONFIG.printMode === "browser"){
    const pa = $("printArea");
    pa.innerHTML = html.replace(/^[\s\S]*<body>|<\/body>[\s\S]*$/g,""); pa.style.display="block";
    const style = html.match(/<style>[\s\S]*?<\/style>/)[0].replace(/body\{/,"#printArea{");
    pa.insertAdjacentHTML("afterbegin", style);
    setTimeout(()=>{ window.print(); pa.style.display="none"; toast(changeMsg); }, 50);
  } else {
    toast(changeMsg);
  }
}

/* Last receipt kept only for this browser tab session, for "Reprint" */
function setLastReceipt(html){ try { sessionStorage.setItem("lastReceipt", html); } catch(_) {} refreshReprint(); }
function getLastReceipt(){ try { return sessionStorage.getItem("lastReceipt"); } catch(_) { return null; } }
function refreshReprint(){ $("btnReprint").hidden = !getLastReceipt(); }
$("btnReprint").onclick = () => {
  const h = getLastReceipt(); if (!h) return;
  if (!confirm(t("reprintConfirm"))) return;
  sendToPrinter(h.replace("<!--REPRINT-->", `<div class="rp">${t("rReprint")}</div>`), t("reprinted"));
};

$("btnConfirm").onclick = () => {
  const s = subtotal(), d = discountCents(), tot = s - d, r = received();
  if (r < tot || !s) return;
  const html = receiptHTML(nextBillNumber(), s, d, tot, r);
  const changeMsg = t("change") + ": " + money(r - tot);
  addToToday(tot, d);
  setLastReceipt(html);
  resetOrder(); activeCat = 0;
  renderCats(); renderOrder(); showScreen("scrMenu");
  sendToPrinter(html, changeMsg);
};

document.querySelector(".tabs").onclick = e => {

$("catEditor").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const el = e.target;
  if (el.id === "catName"){ el.blur(); return; }
  if (el.dataset.f === "name"){ el.closest(".ir").querySelector('[data-f="price"]').focus(); e.preventDefault(); }
  else if (el.dataset.f === "price"){ el.blur(); $("addItem").click(); e.preventDefault(); }

$("catEditor").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const menu = CONFIG.menu, c = menu[setCat];
  if (b.id === "addItem"){ c.items.push({name:"", price:0}); saveSettings(); S.renderMenuEditor(); S.focusLast(); return; }

    const i = +b.dataset.ii, j = i + +b.dataset.imove; if (j<0 || j>=c.items.length) return;

    const i = +b.dataset.idel, it = c.items[i];
    if (it.name.trim() && !confirm(t("delItemConfirm",{x: it.name}))) return;
    c.items.splice(i,1); saveSettings(); S.renderMenuEditor();
  }
});

$("fName").oninput    = e => { CONFIG.shopName = e.target.value; saveSettings(); };
$("fFooter").oninput  = e => { CONFIG.receiptFooter = e.target.value; saveSettings(); };
$("fCur").oninput     = e => { CONFIG.currencySymbol = e.target.value; saveSettings(); };
$("fPrint").onchange  = e => { CONFIG.printMode = e.target.value; saveSettings(); };
$("fDrawer").onchange = e => { CONFIG.openDrawer = e.target.checked; saveSettings(); };
$("fAwake").onchange  = e => { CONFIG.keepAwake = e.target.checked; saveSettings(); updateWakeLock(); };
$("fVibe").onchange   = e => { CONFIG.vibrate = e.target.checked; saveSettings(); buzz(); };
$("fNotes").onchange  = e => {
  CONFIG.quickNotes = e.target.value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,12);
  e.target.value = CONFIG.quickNotes.join(", "); saveSettings();
};
$("fCash").onchange   = e => {
  const v = e.target.value.split(/[,\s]+/).map(Number).filter(n => n > 0);
  CONFIG.cashButtons = v.length ? v.slice(0,8) : clone(DEFAULTS.cashButtons);
  e.target.value = CONFIG.cashButtons.join(", "); saveSettings();
};
$("fDec").onclick = e => { const b=e.target.closest("button"); if(!b) return; CONFIG.decimals = +b.dataset.v; saveSettings(); S.fillGeneral(); applySettings(); };
$("fTheme").onclick = e => { const b=e.target.closest("button"); if(!b) return; CONFIG.theme = b.dataset.v; saveSettings(); S.fillGeneral(); applyTheme(); };
$("fLang").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  CONFIG.lang = b.dataset.v; saveSettings(); applySettings(); S.fillGeneral(); S.renderMenuEditor();
};

$("btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify(CONFIG, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cafe-menu-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t("backupSaved"));
};
$("btnImport").onclick = () => $("fileImport").click();
$("fileImport").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!Array.isArray(data.menu)) throw 0;
      if (!confirm(t("restoreConfirm"))) return;
      CONFIG = normalize(data); setCat = 0; saveSettings(); applySettings();
      S.renderMenuEditor(); S.fillGeneral(); toast(t("backupRestored"));
    } catch(_) { toast(t("badBackup"), true); }
  };
  rd.readAsText(f);
};
$("btnReset").onclick = () => {
  if (!confirm(t("resetConfirm"))) return;
  CONFIG = normalize(null); setCat = 0; saveSettings(); applySettings();
  S.renderMenuEditor(); S.fillGeneral(); toast(t("resetDone"));
};

/* ---------- Helpers ---------- */
function applySettings(){
  scale = Math.pow(10, CONFIG.decimals);
  $("shopName").textContent = CONFIG.shopName;
  document.title = (CONFIG.shopName || "Cafe") + " — " + t("title");
  applyLang(); applyTheme(); buildPad(); renderCats(); renderOrder(); tick(); updateWakeLock();
}
function showScreen(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); }
let tt; function toast(msg, err){ const el=$("toast"); el.textContent=msg; el.className="toast on"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>el.className="toast", err?7000:4000); }
function tick(){ $("clock").textContent = stamp(); }

/* ---------- Coming back from PassPRNT ---------- */
function handleReturn(){
  const p = new URLSearchParams(location.search);
  if (!p.has("passprnt_code")) return;
  const code = p.get("passprnt_code");
  let last = ""; try { last = sessionStorage.getItem("lastChange") || ""; sessionStorage.removeItem("lastChange"); } catch(_) {}
  if (code === "0") toast(t("printed") + "  " + last);
  else toast(t("printFailed") + ": " + (p.get("passprnt_message") || code) + (last ? " — " + last : "") + ". " + t("retryHint"), true);
  history.replaceState(null, "", location.pathname);
}

/* ---------- Start ---------- */
try { navigator.storage?.persist?.(); } catch(_) {}
applySettings(); refreshReprint(); handleReturn(); setInterval(tick, 30000);
</script>
</body>
</html>
